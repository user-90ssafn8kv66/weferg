[project]
name = "outfit-picker"
version = "0.1.0"
description = "Собирает образ из реальных объявлений Авито по пожеланиям и уже имеющимся вещам"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
outfit = "outfit_picker.cli:main"
outfit-web = "outfit_picker.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["outfit_picker"]

[tool.setuptools.package-data]
outfit_picker = ["*.html"]
